[project]
name = "databricks-agentkit-runtime"
version = "0.11.0.dev0"
description = "AgentKit SDK, framework adapters and sandbox worker runtime"
requires-python = ">=3.10"
readme = "RUNTIME.md"
dependencies = [
    "click>=8.4",
    "databricks-ai-bridge[memory]>=0.22.0",
    "fastapi>=0.129.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.20.0",
    "databricks-sdk>=0.124.0",
    "mlflow-tracing>=3.18.0",
    "psycopg[binary]>=3.1",
    "tomli>=2.0",
]

[project.optional-dependencies]
genie = ["databricks-ai-bridge[genie]>=0.22.0"]
sandbox = ["paramiko>=3.5,<6", "grpcio>=1.60", "protobuf>=4.25.8,<7", "websockets>=14,<17"]
langgraph = [
    "databricks-langchain>=0.22.0",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain>=1.0.0",
    "langchain-mcp-adapters>=0.3.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]
openai = ["openai-agents>=0.15.0", "databricks-openai>=0.13.0", "opentelemetry-exporter-otlp-proto-grpc>=1.25.0"]
upgrade = ["gepa>=0.0.26", "litellm>=1.64.0", "mlflow>=3.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databricks_agentkit"]

[tool.uv.sources.databricks-ai-bridge]
path = "../../.."
editable = true
