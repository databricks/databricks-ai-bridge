[project]
name = "agent-custom"
version = "0.1.0"
description = "Your framework or harness on the Agent Bricks durable runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-agentbricks>=0.6.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "httpx>=0.28.1"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
