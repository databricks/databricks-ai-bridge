<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12Z" fill="#617D82"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#234640}</style><rect width="1600" height="720" fill="white"/><text x="25" y="44" font-size="36" font-weight="700" text-anchor="start" style="fill:#234640">Live text streams through the App directly to the client</text><rect x="25" y="80" width="420" height="370" rx="20" fill="#F8FBFA" stroke="#D4E5DF" stroke-width="2.5"/><text x="47" y="119" font-size="25" font-weight="700" text-anchor="start" style="fill:#234640">SESSION SANDBOX</text><rect x="555" y="80" width="510" height="370" rx="20" fill="#F8FBFA" stroke="#D4E5DF" stroke-width="2.5"/><text x="577" y="119" font-size="25" font-weight="700" text-anchor="start" style="fill:#234640">DATABRICKS APP · AGENTKIT</text><rect x="47" y="146" width="376" height="106" rx="14" fill="#F4F7FA" stroke="#7D9BB8" stroke-width="2.5"/><circle cx="72" cy="170" r="18" fill="#365F70"/><text x="72" y="178" font-size="24" font-weight="700" text-anchor="middle" style="fill:white">1</text><text x="235" y="184" font-size="29" font-weight="700" text-anchor="middle" style="fill:#234640">Resident worker</text><text x="235" y="227" font-size="25" font-weight="400" text-anchor="middle" style="fill:#234640">OpenAI / LangGraph adapter</text><path d="M 235,252 L 235,317" fill="none" stroke="#617D82" stroke-width="3"  marker-end="url(#arrow)"/><text x="341" y="290" font-size="24" font-weight="400" text-anchor="middle" style="fill:#526E73">append + flush</text><rect x="47" y="317" width="376" height="106" rx="14" fill="#F4F7FA" stroke="#7D9BB8" stroke-width="2.5"/><text x="235" y="356" font-size="29" font-weight="700" text-anchor="middle" style="fill:#234640">Attempt JSONL file</text><text x="235" y="395" font-size="25" font-weight="400" text-anchor="middle" style="fill:#234640">tail -F runs in the sandbox</text><rect x="577" y="146" width="466" height="277" rx="14" fill="#E9F5F0" stroke="#34998B" stroke-width="2.5"/><circle cx="602" cy="170" r="18" fill="#365F70"/><text x="602" y="178" font-size="24" font-weight="700" text-anchor="middle" style="fill:white">2</text><text x="810" y="194" font-size="31" font-weight="700" text-anchor="middle" style="fill:#234640">SSE subscriber</text><text x="810" y="245" font-size="28" font-weight="400" text-anchor="middle" style="fill:#234640">ExecuteCommand(tail -F)</text><text x="810" y="300" font-size="27" font-weight="400" text-anchor="middle" style="fill:#234640">Decode stdout as JSONL</text><text x="810" y="351" font-size="27" font-weight="400" text-anchor="middle" style="fill:#234640">Rebuild preview in memory</text><text x="810" y="396" font-size="24" font-weight="400" text-anchor="middle" style="fill:#234640">Each connection owns its reader</text><path d="M 577,271 L 463,271 L 463,336 L 423,336" fill="none" stroke="#617D82" stroke-width="3"  marker-end="url(#arrow)"/><text x="505" y="253" font-size="24" font-weight="400" text-anchor="middle" style="fill:#526E73">start tail</text><path d="M 423,390 L 577,390" fill="none" stroke="#617D82" stroke-width="3"  marker-end="url(#arrow)"/><text x="500" y="370" font-size="24" font-weight="400" text-anchor="middle" style="fill:#526E73">bytes</text><rect x="1195" y="146" width="380" height="277" rx="14" fill="#F4F7FA" stroke="#7D9BB8" stroke-width="2.5"/><circle cx="1220" cy="170" r="18" fill="#365F70"/><text x="1220" y="178" font-size="24" font-weight="700" text-anchor="middle" style="fill:white">3</text><text x="1385" y="194" font-size="31" font-weight="700" text-anchor="middle" style="fill:#234640">Chat UI / CLI</text><text x="1385" y="247" font-size="27" font-weight="400" text-anchor="middle" style="fill:#234640">Render live text</text><text x="1385" y="303" font-size="26" font-weight="400" text-anchor="middle" style="fill:#234640">Reconnect to same run</text><text x="1385" y="351" font-size="25" font-weight="400" text-anchor="middle" style="fill:#234640">Replace preview with</text><text x="1385" y="391" font-size="25" font-weight="400" text-anchor="middle" style="fill:#234640">durable final result</text><path d="M 1043,300 L 1195,300" fill="none" stroke="#617D82" stroke-width="3"  marker-end="url(#arrow)"/><text x="1119" y="278" font-size="24" font-weight="400" text-anchor="middle" style="fill:#526E73">SSE</text><path d="M555,548 A255,24 0 0 1 1065,548 L1065,645 A255,24 0 0 1 555,645 Z" fill="#F3EEFA" stroke="#8F6BCB" stroke-width="2.5"/><ellipse cx="810" cy="548" rx="255" ry="24" fill="#F3EEFA" stroke="#8F6BCB" stroke-width="2.5"/><text x="810" y="605" font-size="29" font-weight="700" text-anchor="middle" style="fill:#234640">Lakebase · Runtime Store</text><text x="810" y="641" font-size="25" font-weight="400" text-anchor="middle" style="fill:#234640">Invocation state + final results</text><path d="M 700,450 L 700,523" fill="none" stroke="#617D82" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="490" y="487" font-size="24" font-weight="400" text-anchor="middle" style="fill:#234640">Attempt pointer + lifecycle</text><text x="490" y="518" font-size="24" font-weight="400" text-anchor="middle" style="fill:#234640">and final result writes</text><path d="M 920,523 L 920,450" fill="none" stroke="#617D82" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1188" y="487" font-size="24" font-weight="400" text-anchor="middle" style="fill:#234640">State checks · every 1 s</text><text x="1188" y="518" font-size="24" font-weight="700" text-anchor="middle" style="fill:#234640">No per-token SQL</text><text x="25" y="587" font-size="27" font-weight="700" text-anchor="start" style="fill:#234640">Reconnect</text><text x="25" y="627" font-size="25" font-weight="400" text-anchor="start" style="fill:#234640">Re-read the attempt file;</text><text x="25" y="664" font-size="25" font-weight="400" text-anchor="start" style="fill:#234640">execution keeps running.</text><text x="25" y="704" font-size="24" font-weight="400" text-anchor="start" style="fill:#526E73">Solid: live text path. Dashed: durable metadata. Run-scoped previews; MAR commit/discard is not implemented.</text></svg>