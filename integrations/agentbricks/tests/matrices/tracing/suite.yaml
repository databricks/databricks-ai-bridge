# STUB: copy-me manifest for the tracing matrix. The tracing experiment is get-or-created by
# deploy under /Shared/agentbricks_traces, so there is no workspace dependency to declare for it.
# Add an `existing` requirement here if a real case needs a pre-existing resource.
name: tracing
tests: [matrices/tracing/]
runs:
  nightly:
    timeout_minutes: 90
requires:
  - name: catalog
    kind: existing
    value: ${AGENTBRICKS_E2E_CATALOG:-main}
    check: [catalogs, get]
  - name: scratch_schema
    kind: dab
    bundle: bundle
    catalog: catalog
