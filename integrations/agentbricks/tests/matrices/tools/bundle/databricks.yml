# Per-run scratch schema for this matrix; the UC function and volume live inside it.
bundle:
  name: agentbricks-tools-scratch

variables:
  catalog_name: {}
  run_id: {}

targets:
  nightly:
    default: true
    variables:
      catalog_name: main
  dev:
    variables:
      catalog_name: main

workspace:
  # State is per run so concurrent or repeated runs never rename each other's schema.
  root_path: ~/.bundle/${bundle.name}/${bundle.target}/${var.run_id}

resources:
  schemas:
    scratch_schema:
      catalog_name: ${var.catalog_name}
      name: ab_e2e_${var.run_id}
