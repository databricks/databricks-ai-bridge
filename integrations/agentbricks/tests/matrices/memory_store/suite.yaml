# STUB: copy-me manifest for the memory_store matrix. The memory store is created per project by
# the test fixture and deleted by the runner's teardown registry, so there is no workspace
# dependency to declare for it. Add an `existing` requirement here if a real case needs a pre-
# existing resource.
name: memory_store
tests: [matrices/memory_store/]
runs:
  nightly:
    timeout_minutes: 90
requires:
  - name: catalog
    kind: existing
    value: ${AGENTBRICKS_E2E_CATALOG:-main}
    check: [catalogs, get]
  - name: scratch_schema
    kind: dab
    bundle: bundle
    catalog: catalog
