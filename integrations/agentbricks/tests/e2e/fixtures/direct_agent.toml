schema_version = 1

[agent]
framework = "__FRAMEWORK__"
server = "agentbricks"

[[tools]]
id = "sandbox"
source = { kind = "sandbox", service = "system.ai.sandbox" }
policy = { downscope = [
  { resource = "table:__UC_TABLE__", permission = "read_only" },
  { resource = "volume:__UC_VOLUME__", permission = "read_only" },
] }

[[tools]]
id = "web_search"
source = { kind = "mcp", service = "system.ai.web_search" }

[[tools]]
id = "agentbricks_uc_marker"
source = { kind = "uc_function", function = "__UC_FUNCTION__" }

[[tools]]
id = "genie"
auth = "app"
source = { kind = "genie_agent", space_id = "__GENIE_SPACE_ID__" }
