[project]
name = "databricks-mason"
version = "0.1.2.dev0"
description = "Databricks integration for Mason"
authors = [
    { name="Databricks", email="agent-feedback@databricks.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "databricks-sdk>=0.49",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tomli>=2.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
tracing = [
    "mlflow[databricks]>=3.9.0",
]
# The agent-side runtime helpers a deployed agent imports. Kept as extras so a plain
# `pip install databricks-mason` (the CLI) stays light; each template depends on the extra for its
# framework. `runtime` = the LangGraph adapter (databricks_mason.langgraph); `runtime-openai` = the
# OpenAI Agents SDK adapter (databricks_mason.openai). Both carry the shared framework-neutral stack
# (databricks_mason.runtime); the framework SDKs differ, so an agent installs only the one it uses.
runtime = [
    "databricks-langchain>=0.17.0",
    "langgraph>=1.1.0",
    "langchain>=1.0.0",
    "langchain-mcp-adapters>=0.2.1",
    "fastapi>=0.129.0",
    "mlflow>=3.10.1",
    "uuid-utils>=0.10.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "databricks-agents>=1.9.3",
]
runtime-openai = [
    "openai-agents>=0.7.0",
    "databricks-openai>=0.13.0",
    "fastapi>=0.129.0",
    "mlflow>=3.10.1",
    "uuid-utils>=0.10.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "databricks-agents>=1.9.3",
]

[project.scripts]
mason = "databricks_mason.cli:main"

[dependency-groups]
dev = [
    "ruff==0.14.10",
    "ty==0.0.23",
    { include-group = "tests" },
]
tests = [
    "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "NOTICE",
    "src/databricks_mason/*",
    "src/databricks_mason/py.typed",
    "src/databricks_mason/templates/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_mason"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]

[tool.ty.environment]
root = ["./src", "./tests"]

[tool.ty.src]
include = ["./src", "./tests"]
# The files under templates/ are code-as-data — scaffolding snippets written into a generated agent
# project, not importable package modules. They import scaffold-relative paths (agent.mason.*,
# agent.mcps) that never resolve in the package, so type-checking them here is meaningless.
exclude = ["./src/databricks_mason/templates"]
