[project]
name = "databricks-mason"
version = "0.1.0.dev0"
description = "Databricks integration for Mason"
authors = [
    { name="Databricks", email="agent-feedback@databricks.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "databricks-sdk>=0.49",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tomli>=2.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
tracing = [
    "mlflow[databricks]>=3.9.0",
]

[project.scripts]
mason = "databricks_mason.cli:main"

[dependency-groups]
dev = [
    "ruff==0.14.10",
    "ty==0.0.23",
    { include-group = "tests" },
]
tests = [
    "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "NOTICE",
    "src/databricks_mason/*",
    "src/databricks_mason/py.typed",
    "src/databricks_mason/templates/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_mason"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]

[tool.ty.environment]
root = ["./src", "./tests"]

[tool.ty.src]
include = ["./src", "./tests"]
