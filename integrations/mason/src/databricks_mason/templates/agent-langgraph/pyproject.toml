[project]
name = "agent-langgraph"
version = "0.1.0"
description = "LangGraph agent on Mason's durable runtime for Databricks Apps"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Mason includes the HTTP runtime; this extra adds the langgraph framework adapter.
    "databricks-mason[langgraph]>=0.1.7",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.79.0",
    "databricks-agents>=1.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
