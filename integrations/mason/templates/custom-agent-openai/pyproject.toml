[project]
name = "custom-agent-openai"
version = "0.1.0"
description = "OpenAI Agents SDK agent with a custom FastAPI server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-mason>=0.1.5.dev0",
    "databricks-openai>=0.13.0",
    "databricks-sdk>=0.79.0",
    "fastapi>=0.129.0",
    "openai-agents>=0.7.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
start-server = "runtime.main:main"
