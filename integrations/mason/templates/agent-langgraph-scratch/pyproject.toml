[project]
name = "agent-langgraph-scratch"
version = "0.1.0"
description = "LangGraph agent on the Databricks durable runtime"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "databricks-ai-bridge[agent-server] @ git+https://github.com/shivam5/databricks-ai-bridge.git@demo_with_runtime",
    "databricks-langchain[memory]>=0.17.0",
    "langgraph>=1.1.0",
    "langchain>=1.0.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.79.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.hatch.metadata]
allow-direct-references = true


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "agent.agent:main"
