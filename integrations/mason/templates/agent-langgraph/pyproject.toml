[project]
name = "agent-langgraph"
version = "0.1.0"
description = "LangGraph agent on a FastAPI server for Databricks Apps"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    # The agent-side runtime helpers (databricks_mason.runtime) plus the agent stack they need
    # (langgraph, langchain, fastapi, mlflow, …) come from this extra — see the package's
    # [project.optional-dependencies] runtime.
    "databricks-mason[runtime]>=0.1.3.dev0",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.79.0",
    "databricks-agents>=1.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
