[project]
name = "durable-langgraph-agent"
version = "0.1.0"
description = "Minimal durable LangGraph agent using the Mason runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-mason[runtime]>=0.1.4.dev0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
