<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2A44" flood-opacity="0.10"/>
    </filter>
    <marker id="arw2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E9664F"/>
    </marker>
    <marker id="arwg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B89A90"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="924" height="484" rx="14" fill="#FBF1EC" stroke="#E9664F" stroke-width="2"/>
  <text x="30" y="48" font-size="21" font-weight="bold" fill="#1F2A44">Runtime</text>

  <!-- ===== Shared request path: Client -> FastAPI server ===== -->
  <rect x="250" y="76" width="140" height="56" rx="9" fill="#F7FAFD" stroke="#D3DCE6" stroke-width="1.3"/>
  <text x="320" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2A44">Client</text>

  <line x1="390" y1="104" x2="436" y2="104" stroke="#E9664F" stroke-width="2" marker-end="url(#arw2)"/>
  <text x="413" y="96" text-anchor="middle" font-size="9" font-family="Liberation Mono, monospace" fill="#8A94A6">POST</text>

  <rect x="440" y="76" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft2)"/>
  <text x="570" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A44">FastAPI server</text>
  <text x="570" y="118" text-anchor="middle" font-size="10" fill="#8A94A6">deployed as a Databricks App</text>

  <!-- ===== Fork: the server is one of two implementations ===== -->
  <line x1="570" y1="132" x2="570" y2="158" stroke="#B89A90" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="227" y1="158" x2="679" y2="158" stroke="#B89A90" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="227" y1="158" x2="227" y2="190" stroke="#B89A90" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arwg)"/>
  <line x1="679" y1="158" x2="679" y2="190" stroke="#B89A90" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arwg)"/>
  <rect x="548" y="134" width="44" height="22" rx="11" fill="#FBF1EC" stroke="#E3C6BC" stroke-width="1.1"/>
  <text x="570" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#C64A33">or</text>

  <!-- ===== Implementation A: AgentApp (managed) ===== -->
  <rect x="26" y="192" width="402" height="286" rx="12" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.3"/>
  <text x="46" y="220" font-size="15" font-weight="bold" fill="#1F2A44">AgentApp</text>
  <rect x="316" y="204" width="96" height="24" rx="12" fill="#E7F4EE" stroke="#B7DFC9" stroke-width="1"/>
  <text x="364" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E8B63">managed</text>

  <rect x="44" y="244" width="132" height="52" rx="9" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft2)"/>
  <text x="110" y="266" text-anchor="middle" font-size="10.5" font-family="Liberation Mono, monospace" fill="#4A5568">@app.invoke</text>
  <text x="110" y="282" text-anchor="middle" font-size="9.5" fill="#8A94A6">one handler</text>

  <line x1="176" y1="270" x2="202" y2="270" stroke="#E9664F" stroke-width="2" marker-end="url(#arw2)"/>

  <text x="313" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8A94A6">invocation modes</text>
  <rect x="206" y="244" width="206" height="26" rx="6" fill="#F7FAFD" stroke="#DCE4EE" stroke-width="1"/>
  <text x="218" y="261" font-size="11" font-weight="bold" fill="#1F2A44">sync</text>
  <text x="400" y="261" text-anchor="end" font-size="9.5" font-family="Liberation Mono, monospace" fill="#5B76A0">200 {output}</text>
  <rect x="206" y="274" width="206" height="26" rx="6" fill="#F7FAFD" stroke="#DCE4EE" stroke-width="1"/>
  <text x="218" y="291" font-size="11" font-weight="bold" fill="#1F2A44">background</text>
  <text x="400" y="291" text-anchor="end" font-size="9.5" font-family="Liberation Mono, monospace" fill="#5B76A0">202 status_url</text>
  <rect x="206" y="304" width="206" height="26" rx="6" fill="#F7FAFD" stroke="#DCE4EE" stroke-width="1"/>
  <text x="218" y="321" font-size="11" font-weight="bold" fill="#1F2A44">streaming (SSE)</text>
  <text x="400" y="321" text-anchor="end" font-size="9.5" font-family="Liberation Mono, monospace" fill="#5B76A0">event stream</text>

  <text x="227" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8A94A6">capabilities</text>
  <rect x="44" y="368" width="368" height="40" rx="8" fill="#E9F1FC" stroke="#B9CBE4" stroke-width="1.2"/>
  <text x="228" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#24467D">Durable runtime (Lakebase)</text>
  <text x="228" y="401" text-anchor="middle" font-size="9" font-family="Liberation Mono, monospace" fill="#4A6699">input &#183; status &#183; heartbeat &#183; events &#183; output</text>
  <rect x="44" y="414" width="368" height="40" rx="8" fill="#FFF4F0" stroke="#E3C6BC" stroke-width="1.2"/>
  <text x="228" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#C64A33">Automatic crash recovery</text>
  <text x="228" y="447" text-anchor="middle" font-size="9" fill="#4A5568">interrupted runs resume automatically</text>

  <!-- ===== Implementation B: Custom (full control) ===== -->
  <rect x="452" y="192" width="454" height="286" rx="12" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.3"/>
  <text x="472" y="220" font-size="15" font-weight="bold" fill="#1F2A44">Custom</text>
  <rect x="784" y="204" width="104" height="24" rx="12" fill="#EEF0FA" stroke="#C7CDEB" stroke-width="1"/>
  <text x="836" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A4F9E">full control</text>
  <text x="472" y="244" font-size="10" font-family="Liberation Mono, monospace" fill="#8A94A6">mason init --server custom</text>

  <rect x="472" y="262" width="414" height="72" rx="9" fill="#FBFCFE" stroke="#CBD6E4" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="679" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A44">your own endpoints &amp; protocol</text>
  <text x="679" y="316" text-anchor="middle" font-size="10.5" font-family="Liberation Mono, monospace" fill="#5B76A0">/your-route &#183; your request/response shapes</text>

  <text x="679" y="366" text-anchor="middle" font-size="10.5" fill="#8A94A6">no AgentApp - you define the invocation contract</text>
  <text x="679" y="388" text-anchor="middle" font-size="10.5" fill="#8A94A6">durability and crash recovery are yours to build</text>
</svg>
