<svg xmlns="http://www.w3.org/2000/svg" width="940" height="474" viewBox="0 0 940 474" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2A44" flood-opacity="0.10"/>
    </filter>
    <marker id="arw2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E9664F"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="924" height="458" rx="14" fill="#FBF1EC" stroke="#E9664F" stroke-width="2"/>
  <text x="30" y="50" font-size="21" font-weight="bold" fill="#1F2A44">Runtime</text>

  <!-- ===== Lane 1: AgentApp ===== -->
  <rect x="26" y="68" width="888" height="180" rx="12" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.3"/>
  <text x="46" y="96" font-size="15" font-weight="bold" fill="#1F2A44">AgentApp</text>
  <rect x="790" y="80" width="104" height="24" rx="12" fill="#E7F4EE" stroke="#B7DFC9" stroke-width="1"/>
  <text x="842" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E8B63">managed</text>

  <rect x="44" y="150" width="120" height="66" rx="9" fill="#F7FAFD" stroke="#D3DCE6" stroke-width="1.3"/>
  <text x="104" y="188" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2A44">Client</text>

  <line x1="164" y1="183" x2="196" y2="183" stroke="#E9664F" stroke-width="2" marker-end="url(#arw2)"/>
  <text x="180" y="175" text-anchor="middle" font-size="9" font-family="Liberation Mono, monospace" fill="#8A94A6">POST</text>

  <rect x="200" y="150" width="140" height="66" rx="9" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft2)"/>
  <text x="270" y="181" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2A44">AgentApp</text>
  <text x="270" y="201" text-anchor="middle" font-size="10.5" font-family="Liberation Mono, monospace" fill="#4A5568">@app.invoke</text>

  <line x1="340" y1="183" x2="372" y2="183" stroke="#E9664F" stroke-width="2" marker-end="url(#arw2)"/>

  <text x="478" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A94A6">invocation modes</text>
  <rect x="376" y="148" width="204" height="28" rx="6" fill="#F7FAFD" stroke="#DCE4EE" stroke-width="1"/>
  <text x="388" y="166" font-size="12" font-weight="bold" fill="#1F2A44">sync</text>
  <text x="568" y="166" text-anchor="end" font-size="10.5" font-family="Liberation Mono, monospace" fill="#5B76A0">200 {output}</text>
  <rect x="376" y="180" width="204" height="28" rx="6" fill="#F7FAFD" stroke="#DCE4EE" stroke-width="1"/>
  <text x="388" y="198" font-size="12" font-weight="bold" fill="#1F2A44">background</text>
  <text x="568" y="198" text-anchor="end" font-size="10.5" font-family="Liberation Mono, monospace" fill="#5B76A0">202 status_url</text>
  <rect x="376" y="212" width="204" height="28" rx="6" fill="#F7FAFD" stroke="#DCE4EE" stroke-width="1"/>
  <text x="388" y="230" font-size="12" font-weight="bold" fill="#1F2A44">streaming (SSE)</text>
  <text x="568" y="230" text-anchor="end" font-size="10.5" font-family="Liberation Mono, monospace" fill="#5B76A0">event stream</text>

  <text x="751" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A94A6">capabilities</text>
  <rect x="612" y="150" width="278" height="42" rx="8" fill="#E9F1FC" stroke="#B9CBE4" stroke-width="1.2"/>
  <text x="751" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#24467D">Durable runtime (Lakebase)</text>
  <text x="751" y="184" text-anchor="middle" font-size="9.5" font-family="Liberation Mono, monospace" fill="#4A6699">input &#183; status &#183; heartbeat &#183; events &#183; output</text>
  <rect x="612" y="198" width="278" height="42" rx="8" fill="#FFF4F0" stroke="#E3C6BC" stroke-width="1.2"/>
  <text x="751" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#C64A33">Automatic crash recovery</text>
  <text x="751" y="232" text-anchor="middle" font-size="9.5" fill="#4A5568">interrupted runs resume automatically</text>

  <!-- ===== divider ===== -->
  <line x1="26" y1="270" x2="430" y2="270" stroke="#E3C6BC" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="440" y="258" width="60" height="24" rx="12" fill="#FBF1EC" stroke="#E3C6BC" stroke-width="1.2"/>
  <text x="470" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#C64A33">or</text>
  <line x1="510" y1="270" x2="906" y2="270" stroke="#E3C6BC" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ===== Lane 2: Custom server ===== -->
  <rect x="26" y="294" width="888" height="150" rx="12" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.3"/>
  <text x="46" y="322" font-size="15" font-weight="bold" fill="#1F2A44">Custom server</text>
  <rect x="772" y="306" width="122" height="24" rx="12" fill="#EEF0FA" stroke="#C7CDEB" stroke-width="1"/>
  <text x="833" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A4F9E">full control</text>

  <rect x="44" y="352" width="120" height="60" rx="9" fill="#F7FAFD" stroke="#D3DCE6" stroke-width="1.3"/>
  <text x="104" y="387" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2A44">Client</text>

  <line x1="164" y1="382" x2="196" y2="382" stroke="#E9664F" stroke-width="2" marker-end="url(#arw2)"/>

  <rect x="200" y="346" width="222" height="72" rx="9" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft2)"/>
  <text x="311" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A44">minimal FastAPI</text>
  <text x="311" y="395" text-anchor="middle" font-size="10.5" font-family="Liberation Mono, monospace" fill="#4A5568">mason init --server custom</text>
  <text x="311" y="409" text-anchor="middle" font-size="9.5" fill="#8A94A6">no AgentApp</text>

  <line x1="422" y1="382" x2="454" y2="382" stroke="#E9664F" stroke-width="2" marker-end="url(#arw2)"/>

  <rect x="458" y="346" width="432" height="72" rx="9" fill="#FBFCFE" stroke="#CBD6E4" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="674" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A44">your own endpoints &amp; protocol</text>
  <text x="674" y="399" text-anchor="middle" font-size="10.5" font-family="Liberation Mono, monospace" fill="#5B76A0">/your-route &#183; your request/response shapes</text>
</svg>
