<svg xmlns="http://www.w3.org/2000/svg" width="940" height="316" viewBox="0 0 940 316" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2A44" flood-opacity="0.10"/>
    </filter>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E9664F"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="924" height="300" rx="14" fill="#FBF1EC" stroke="#E9664F" stroke-width="2"/>
  <text x="30" y="52" font-size="21" font-weight="bold" fill="#1F2A44">Deployment</text>
  <text x="910" y="48" font-size="12.5" text-anchor="end" fill="#8A94A6">from a blank directory &#8594; a running service</text>

  <line x1="182" y1="148" x2="208" y2="148" stroke="#E9664F" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="364" y1="148" x2="390" y2="148" stroke="#E9664F" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="546" y1="148" x2="572" y2="148" stroke="#E9664F" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="728" y1="148" x2="754" y2="148" stroke="#E9664F" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="32" y="104" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft)"/>
  <text x="107" y="142" text-anchor="middle" font-size="15" font-weight="bold" font-family="Liberation Mono, monospace" fill="#1F2A44">mason init</text>
  <text x="107" y="164" text-anchor="middle" font-size="11" fill="#8A94A6">scaffold from a</text>
  <text x="107" y="178" text-anchor="middle" font-size="11" fill="#8A94A6">framework template</text>

  <rect x="214" y="104" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft)"/>
  <text x="289" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2A44">agent project</text>
  <text x="289" y="163" text-anchor="middle" font-size="11.5" font-family="Liberation Mono, monospace" fill="#4A5568">agent.toml</text>
  <text x="289" y="179" text-anchor="middle" font-size="11" fill="#8A94A6">+ your agent code</text>

  <rect x="396" y="104" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft)"/>
  <text x="471" y="142" text-anchor="middle" font-size="15" font-weight="bold" font-family="Liberation Mono, monospace" fill="#1F2A44">mason dev</text>
  <text x="471" y="164" text-anchor="middle" font-size="11" fill="#8A94A6">run locally,</text>
  <text x="471" y="178" text-anchor="middle" font-size="11" fill="#8A94A6">same manifest &#183; chat UI</text>

  <rect x="578" y="104" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#E9A08C" stroke-width="1.4" filter="url(#soft)"/>
  <text x="653" y="142" text-anchor="middle" font-size="15" font-weight="bold" font-family="Liberation Mono, monospace" fill="#1F2A44">mason deploy</text>
  <text x="653" y="164" text-anchor="middle" font-size="11" fill="#8A94A6">ship to</text>
  <text x="653" y="178" text-anchor="middle" font-size="11" fill="#8A94A6">Databricks Apps</text>

  <rect x="760" y="104" width="148" height="88" rx="10" fill="#EAF6F0" stroke="#8FCBAE" stroke-width="1.4" filter="url(#soft)"/>
  <text x="834" y="141" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F7A50">Databricks Apps</text>
  <text x="834" y="164" text-anchor="middle" font-size="11" fill="#4C8B6B">running agent</text>
  <text x="834" y="179" text-anchor="middle" font-size="11" fill="#4C8B6B">HTTP endpoint</text>

  <line x1="653" y1="192" x2="653" y2="226" stroke="#D3A79A" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="214" y="226" width="694" height="60" rx="9" fill="#FFFFFF" stroke="#E3C6BC" stroke-width="1.4"/>
  <text x="232" y="250" font-size="12.5" font-weight="bold" fill="#C64A33">mason deploy also provisions &amp; wires up, from agent.toml:</text>
  <text x="232" y="271" font-size="11" font-family="Liberation Mono, monospace" fill="#4A5568">bound memory &amp; session stores &#183; service-principal grants &#183; durable-runtime DB &#183; MLflow tracing</text>
</svg>
