bundle:
  name: open_ai_sdk_agent_recovery

variables:
  event_log_lakebase_branch:
    description: Lakebase branch resource for event-log recovery
  event_log_lakebase_database:
    description: Lakebase database resource for event-log recovery
  agent_session_lakebase_branch:
    description: Lakebase branch resource for agent-session recovery
  agent_session_lakebase_database:
    description: Lakebase database resource for agent-session recovery
  openai_secret_scope:
    description: Secret scope containing the OpenAI API key
  openai_secret_key:
    description: Secret key containing the OpenAI API key

resources:
  apps:
    event_log_recovery:
      name: openai-event-log-recovery
      description: OpenAI agent with event-log recovery
      source_code_path: ./event_log_recovery
      config:
        command: ["python", "app.py"]
        env:
          - name: OPENAI_API_KEY
            value_from: openai-api-key
          - name: OPENAI_MODEL
            value: gpt-4.1-mini
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value_from: postgres
          - name: LAKEBASE_SESSION_SCHEMA
            value: openai_event_log_sessions
      resources:
        - name: openai-api-key
          secret:
            scope: ${var.openai_secret_scope}
            key: ${var.openai_secret_key}
            permission: READ
        - name: postgres
          postgres:
            branch: ${var.event_log_lakebase_branch}
            database: ${var.event_log_lakebase_database}
            permission: CAN_CONNECT_AND_CREATE

    agent_session_recovery:
      name: openai-agent-session
      description: OpenAI agent with SDK-session recovery
      source_code_path: ./agent_session_recovery
      config:
        command: ["python", "app.py"]
        env:
          - name: OPENAI_API_KEY
            value_from: openai-api-key
          - name: OPENAI_MODEL
            value: gpt-4.1-mini
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value_from: postgres
          - name: LAKEBASE_SESSION_SCHEMA
            value: openai_agent_session_sessions
      resources:
        - name: openai-api-key
          secret:
            scope: ${var.openai_secret_scope}
            key: ${var.openai_secret_key}
            permission: READ
        - name: postgres
          postgres:
            branch: ${var.agent_session_lakebase_branch}
            database: ${var.agent_session_lakebase_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
