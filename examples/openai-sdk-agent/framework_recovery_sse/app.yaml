    valueFrom: openai-api-key
  - name: OPENAI_MODEL
    value: gpt-5.6-luna
  - name: LAKEBASE_AUTOSCALING_ENDPOINT
    valueFrom: postgres
  - name: LAKEBASE_SESSION_SCHEMA
    value: openai_framework_sse_sessions
