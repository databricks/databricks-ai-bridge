bundle:
  name: open_ai_sdk_agent_recovery_examples

variables:
  framework_recovery_sse_lakebase_branch:
    description: Full Lakebase branch resource name for framework recovery with SSE replay
  framework_recovery_sse_lakebase_database:
    description: Full Lakebase database resource name for framework recovery with SSE replay
  agent_recovery_sse_lakebase_branch:
    description: Full Lakebase branch resource name for agent-managed recovery with SSE replay
  agent_recovery_sse_lakebase_database:
    description: Full Lakebase database resource name for agent-managed recovery with SSE replay
  agent_recovery_polling_lakebase_branch:
    description: Full Lakebase branch resource name for agent-managed recovery without SSE replay
  agent_recovery_polling_lakebase_database:
    description: Full Lakebase database resource name for agent-managed recovery without SSE replay
  openai_secret_scope:
    description: Databricks secret scope containing the OpenAI API key
  openai_secret_key:
    description: Databricks secret key containing the OpenAI API key

resources:
  apps:
    framework_recovery_sse:
      name: openai-agent-framework-sse
      description: Framework-managed recovery with durable SSE replay
      source_code_path: ./framework_recovery_sse
      config:
        command: ["python", "app.py"]
        env:
          - name: OPENAI_API_KEY
            value_from: openai-api-key
          - name: OPENAI_MODEL
            value: gpt-5.6-luna
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value_from: postgres
          - name: LAKEBASE_SESSION_SCHEMA
            value: openai_framework_sse_sessions
      resources:
        - name: openai-api-key
          secret:
            scope: ${var.openai_secret_scope}
            key: ${var.openai_secret_key}
            permission: READ
        - name: postgres
          postgres:
            branch: ${var.framework_recovery_sse_lakebase_branch}
            database: ${var.framework_recovery_sse_lakebase_database}
            permission: CAN_CONNECT_AND_CREATE

    agent_recovery_sse:
      name: openai-agent-session-sse
      description: Agent-session-managed recovery with durable SSE replay
      source_code_path: ./agent_recovery_sse
      config:
        command: ["python", "app.py"]
        env:
          - name: OPENAI_API_KEY
            value_from: openai-api-key
          - name: OPENAI_MODEL
            value: gpt-5.6-luna
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value_from: postgres
          - name: LAKEBASE_SESSION_SCHEMA
            value: openai_agent_sse_sessions
      resources:
        - name: openai-api-key
          secret:
            scope: ${var.openai_secret_scope}
            key: ${var.openai_secret_key}
            permission: READ
        - name: postgres
          postgres:
            branch: ${var.agent_recovery_sse_lakebase_branch}
            database: ${var.agent_recovery_sse_lakebase_database}
            permission: CAN_CONNECT_AND_CREATE

    agent_recovery_polling:
      name: openai-agent-session-poll
      description: Agent-session-managed recovery without SSE event persistence
      source_code_path: ./agent_recovery_polling
      config:
        command: ["python", "app.py"]
        env:
          - name: OPENAI_API_KEY
            value_from: openai-api-key
          - name: OPENAI_MODEL
            value: gpt-5.6-luna
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value_from: postgres
          - name: LAKEBASE_SESSION_SCHEMA
            value: openai_agent_polling_sessions
      resources:
        - name: openai-api-key
          secret:
            scope: ${var.openai_secret_scope}
            key: ${var.openai_secret_key}
            permission: READ
        - name: postgres
          postgres:
            branch: ${var.agent_recovery_polling_lakebase_branch}
            database: ${var.agent_recovery_polling_lakebase_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
