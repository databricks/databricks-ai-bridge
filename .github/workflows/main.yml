name: tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

env:
  UV_VERSION: "0.13.5"

jobs:
  agentbricks_release_helper_test:
    runs-on: ubuntu-latest
    name: "agentbricks_release_helper_test (python: 3.11)"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m unittest discover .github/scripts/tests

  core_test:
    runs-on: ubuntu-latest
    name: "core_test (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests \
            pytest --cov --cov-report=term tests/

  core_test_with_extras:
    runs-on: ubuntu-latest
    name: "core_test_with_extras (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests with extras
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests --extra memory \
            pytest --cov --cov-report=term tests/

  langchain_test:
    runs-on: ubuntu-latest
    name: "langchain_test (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]

    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: integrations/langchain
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests pytest --cov --cov-report=term tests/unit_tests

  langchain_test_with_extras:
    runs-on: ubuntu-latest
    name: "langchain_test_with_extras (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests with extras
        working-directory: integrations/langchain
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests --extra memory \
            pytest --cov --cov-report=term tests/unit_tests

  langchain_test_deepagents:
    runs-on: ubuntu-latest
    name: "langchain_test_deepagents (python: 3.11)"
    # The deepagents extra requires Python >=3.11, so it is omitted from the 3.10
    # jobs above (its unit tests importorskip there); run them here on 3.11.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Run tests with deepagents extra
        working-directory: integrations/langchain
        run: |
          uv run --exact --group tests --extra deepagents \
            pytest --cov --cov-report=term tests/unit_tests

  langchain_cross_version_test:
    runs-on: ubuntu-latest
    name: langchain_test (${{ matrix.python-version }}, ${{ matrix.version.name }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        version:
          - { ref: "databricks-ai-v0.5.0", name: "v0.5.0" }
          - { ref: "databricks-ai-v0.4.0", name: "v0.4.0" }
          - { ref: "databricks-ai-v0.3.0", name: "v0.3.0" }
          - { ref: "databricks-ai-v0.2.0", name: "v0.2.0" }
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install .
      - name: Checkout langchain version
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.version.ref }}
          fetch-depth: 1
          path: older-version
      - name: Replace langchain with older version
        run: |
          # Remove current langchain if it exists to avoid conflicts
          rm -rf integrations/langchain

          # Copy older version of langchain to the main repo
          cp -r older-version/integrations/langchain integrations/
      - name: Install langchain dependency
        run: |
          pip install integrations/langchain --group dev
      - name: Run tests
        run: |
          # Only testing initialization since functionality can change
          pytest integrations/langchain/tests/unit_tests/test_vector_search_retriever_tool.py::test_init
          pytest integrations/langchain/tests/unit_tests/test_genie.py
          pytest integrations/langchain/tests/unit_tests/test_embeddings.py
          pytest integrations/langchain/tests/unit_tests/test_chat_models.py

  openai_test:
    runs-on: ubuntu-latest
    name: "openai_test (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: integrations/openai
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests pytest --cov --cov-report=term tests/unit_tests

  openai_test_with_extras:
    runs-on: ubuntu-latest
    name: "openai_test_with_extras (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests with extras
        working-directory: integrations/openai
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests --extra memory \
            pytest --cov --cov-report=term tests/unit_tests

  openai_cross_version_test:
    runs-on: ubuntu-latest
    name: openai_test (${{ matrix.python-version }}, ${{ matrix.version.name }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        version:
          - { ref: "databricks-ai-v0.5.0", name: "v0.5.0" }
          - { ref: "databricks-ai-v0.4.0", name: "v0.4.0" }
          - { ref: "databricks-ai-v0.3.0", name: "v0.3.0" }
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout openai version
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.version.ref }}
          fetch-depth: 1
          path: older-version
      - name: Install current core and historical OpenAI integration
        run: |
          pip install . older-version/integrations/openai --group dev
          pip check
      - name: Run maintained compatibility tests
        run: |
          pytest -c pyproject.toml integrations/openai/tests/compatibility

  llamaindex_test:
    runs-on: ubuntu-latest
    name: "llamaindex_test (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: integrations/llamaindex
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} --exact --group tests pytest --cov --cov-report=term tests/unit_tests

  mcp_test:
    runs-on: ubuntu-latest
    name: "mcp_test (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: databricks_mcp
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests pytest --cov --cov-report=term tests/unit_tests

  dspy_test:
    runs-on: ubuntu-latest
    name: "dspy_test (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: integrations/dspy
        run: |
          uv run --resolution ${{ matrix.uv-resolution }} \
            --exact --group tests pytest --cov --cov-report=term tests/unit_tests

  agentbricks_test:
    runs-on: ubuntu-latest
    name: "agentbricks_test (python: ${{ matrix.python-version }}, uv: ${{ matrix.uv-resolution }})"
    strategy:
      matrix:
        python-version: ["3.10"]
        uv-resolution: ["lowest-direct", "highest"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: integrations/agentbricks
        run: bash ../../.github/scripts/run_agentbricks_tests.sh unit "${{ matrix.uv-resolution }}"

  agentbricks_framework_test:
    runs-on: ubuntu-latest
    name: "agentbricks_framework_test (python: 3.11, uv: highest)"
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          # Generated LangGraph agents require Python 3.11 or newer.
          python-version: "3.11"
      - name: Run tests with framework dependencies
        working-directory: integrations/agentbricks
        run: bash ../../.github/scripts/run_agentbricks_tests.sh framework

  agentbricks_dev_functional:
    runs-on: ${{ matrix.os }}
    name: "agentbricks_dev_functional (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: tests/suites
          # Dev servers boot one at a time and macOS runners are about twice as slow, so macOS
          # checks the platform (run-local, the printed command in its shell) on two templates;
          # every template runs on ubuntu and on both platforms at the release cut.
          - os: macos-latest
            tests: >-
              tests/suites/test_dev.py::test_dev
              tests/suites/test_dev.py::test_dev_templates[openai-managed-ui]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      # `agentbricks dev` runs the app through `databricks apps run-local`.
      - name: Install the Databricks CLI
        uses: databricks/setup-cli@e0f69d54c90e95ccad22d5ff17751da665e599a9
        # The suites' fake workspace is verified against this CLI; with the action's default
        # (0.295.0), `apps run-local` fails at startup with `strconv.ParseInt: parsing ""`.
        with:
          version: 1.22.1
      # Build the wheels and run the E2E suites against a fake workspace from a venv they are
      # installed into, so the tests exercise the shipped artifact (a packaging gap fails here)
      # rather than an editable source tree. `agentbricks` on PATH is the wheel's console script,
      # and the suites pin every scaffolded agent to the same wheels.
      - name: Build the Agent Bricks wheels and run the suites
        working-directory: integrations/agentbricks
        run: bash ../../.github/scripts/run_agentbricks_tests.sh suites-fake ${{ matrix.tests }}
